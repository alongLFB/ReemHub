services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reemhub
      POSTGRES_USER: reemhub
      POSTGRES_PASSWORD: reemhub
    ports:
      - "5432:5432"
    volumes:
      - reemhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reemhub -d reemhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reemhub-postgres:
