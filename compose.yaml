services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uaehub
      POSTGRES_USER: uaehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - uaehub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uaehub -d uaehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uaehub-postgres:
